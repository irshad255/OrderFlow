
spring.application.name=orderflow

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Dev%20Database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate validates schema; Flyway owns migrations (for local env change update to validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true


# Logging
logging.level.org.flywaydb=INFO

# Write application logs to a file
logging.file.name=./observability/logs/orderflow.log

# Structured JSON logging
logging.structured.format.file=logstash

#Isse structured JSON logging MDC fields ko include karegi,
# jisme correlationId bhi hoga.
logging.structured.json.add.mdc=true


# Health and info endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
