name: OrderFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orderflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and JaCoCo coverage gate
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderflow_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root123

# Branch protection verification